name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (X.Y.Z)
        required: true
        type: string
      source_sha:
        description: Full commit SHA accepted during native UI testing
        required: true
        type: string
      ui_verified:
        description: I checked sidebar startup, resize, Settings, and capture on this commit
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require explicit candidate acceptance
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UI_VERIFIED: ${{ inputs.ui_verified }}
        run: |
          set -euo pipefail
          [[ "$UI_VERIFIED" == true ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$VERSION" != 0.0.0 ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  package:
    needs: candidate
    uses: ./.github/workflows/package-release.yml
    with:
      source_sha: ${{ needs.candidate.outputs.sha }}
      version: ${{ needs.candidate.outputs.version }}
      release_tag: v${{ needs.candidate.outputs.version }}
      channel: stable
