name: Release DMG

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-dmg-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build Apple Silicon DMG
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
      checks: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      BUILD_SYSTEM: xcodebuild
      XCODE_BUILD_LOG: ci-logs/xcode-release-build.log
      REQUIRE_MEETING_ECHO_ASSETS: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Require source commit CI
        timeout-minutes: 81
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/dist/require_ci.sh "$(git rev-parse HEAD)" --wait

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate release version and architecture
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$version" == "0.0.0" ]]; then
            echo "Release tag must be X.Y.Z or vX.Y.Z (excluding 0.0.0)." >&2
            exit 1
          fi
          [[ "$(uname -m)" == "arm64" ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          mkdir -p ci-logs

      - name: Build complete app bundle
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-release-xcode
          SOTTO_MEETING_ECHO_ASSETS_DIR: ${{ runner.temp }}/sotto-meeting-echo-assets
          LOCALVQE_SOURCE_DIR: ${{ runner.temp }}/sotto-localvqe-src
        shell: bash
        run: |
          set -euo pipefail
          scripts/dist/build_app_bundle.sh 2>&1 | tee ci-logs/build-app.log
          scripts/dist/verify_release_version.sh dist/Sotto.app

      - name: Package and verify DMG
        shell: bash
        run: scripts/dist/build_dmg.sh dist/Sotto.app "dist/Sotto-${VERSION}-arm64.dmg"

      - name: Attach DMG and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/Sotto-${VERSION}-arm64.dmg" \
            "dist/Sotto-${VERSION}-arm64.dmg.sha256" --clobber

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-dmg-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
