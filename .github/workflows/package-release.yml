name: Package release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  source-ci:
    name: Validate candidate and wait for source CI
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      BUILD_GIT_COMMIT: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate channel and tag
        run: |
          python3 scripts/dist/publish_release.py --validate

      - name: Require source commit CI
        timeout-minutes: 81
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/dist/require_ci.sh "$(git rev-parse HEAD)" --wait

  dmg:
    needs: source-ci
    name: Build and publish Apple Silicon DMG
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
      checks: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      BUILD_GIT_COMMIT: ${{ inputs.source_sha }}
      BUILD_SOURCE: github-${{ inputs.channel }}
      APP_NAME: Sotto
      BUILD_SYSTEM: xcodebuild
      XCODE_BUILD_LOG: ci-logs/xcode-release-build.log
      REQUIRE_MEETING_ECHO_ASSETS: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      # Use the distribution cache identity and path so eligible CI caches
      # can seed releases. Always rebuild before packaging the release.
      - name: Xcode Cache Identity
        id: xcode_cache
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-xcode-dist
        shell: bash
        run: |
          fingerprint=$(bash scripts/ci/xcode-cache-key.sh)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode Build State
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sotto-xcode-dist
          key: xcode-v1-${{ steps.xcode_cache.outputs.fingerprint }}-${{ steps.xcode_cache.outputs.commit }}
          restore-keys: |
            xcode-v1-${{ steps.xcode_cache.outputs.fingerprint }}-


      - name: Set build identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$VERSION" != 0.0.0 ]]
          [[ "$(uname -m)" == arm64 ]]
          {
            echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)"
            if [[ "$RELEASE_CHANNEL" == nightly ]]; then
              echo "APP_NAME=Sotto-Nightly"
              echo "BUNDLE_ID=com.sotto.nightly"
              echo "EXPECTED_BUNDLE_ID=com.sotto.nightly"
              echo "DMG_VOLUME_NAME=Sotto Nightly"
            fi
          } >> "$GITHUB_ENV"
          mkdir -p ci-logs

      - name: Build complete app bundle
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-xcode-dist
          SOTTO_MEETING_ECHO_ASSETS_DIR: ${{ runner.temp }}/sotto-meeting-echo-assets
          LOCALVQE_SOURCE_DIR: ${{ runner.temp }}/sotto-localvqe-src
        shell: bash
        run: |
          set -euo pipefail
          scripts/dist/build_app_bundle.sh 2>&1 | tee ci-logs/build-app.log
          scripts/dist/verify_release_version.sh "dist/${APP_NAME}.app"

      - name: Package and verify DMG
        shell: bash
        run: scripts/dist/build_dmg.sh "dist/${APP_NAME}.app" "dist/Sotto-${RELEASE_TAG#v}-arm64.dmg"

      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/dist/publish_release.py

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-dmg-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
