name: CI

on:
  push:
    # PRs validate feature branches; avoid a second full run for the same update.
    branches: [master]
    # Keep tag validation when restricting branch pushes.
    tags: ["**"]
    paths-ignore:
      - "docs/**"
      - "plans/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plans/**"
  workflow_dispatch:
    inputs:
      qualify_build_cache:
        description: Rebuild changed app source and resources from restored caches
        type: boolean
        default: false

concurrency:
  # Keep each master push's CI run alive so a later merge cannot cancel the
  # exact-SHA validation required by that commit's nightly release.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  behavior:
    name: Tests and Swift 6 (${{ matrix.test_group }})
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        test_group: [general, audio]
    env:
      AUDIO_TEST_FILTER: 'MeetingEcho(DelayEstimator|SuppressionRuntime|Suppressor)Tests'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      # The Meeting Process Recovery step below exercises the real audio
      # conversion path (not a mock), so it needs a real ffmpeg on PATH;
      # this runner image does not ship one.
      - name: Install FFmpeg
        timeout-minutes: 5
        run: brew install ffmpeg

      - name: Runner and Toolchain Evidence
        timeout-minutes: 2
        run: |
          mkdir -p ci-logs
          set -o pipefail
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            sysctl -n hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
          } 2>&1 | tee ci-logs/environment.log

      - name: Check Subsystem README References
        timeout-minutes: 1
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./scripts/check-readme-references.sh 2>&1 | tee ci-logs/check-readme-references.log

      - name: CI Helper Tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      # Consumer contract check for the SwiftPM toolchain itself, not this
      # project's cache: an owned temp package proves archive/restore keeps
      # working, a changed or deleted dependency source is reconciled, and a
      # manifest change is honored. This does not measure this repo's actual
      # cold/warm cache timings or source-invalidation behavior.
      - name: SwiftPM Build Reuse Contract
        timeout-minutes: 3
        run: |
          mkdir -p ci-logs
          set -o pipefail
          bash scripts/ci/test-swiftpm-build-reuse.sh 2>&1 | tee ci-logs/swiftpm-build-reuse.log

      - name: Swift Format Lint (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p ci-logs
          set -o pipefail
          xcrun swift-format lint --recursive --configuration .swift-format Sources Tests 2>&1 | tee ci-logs/swift-format-lint.log

      - name: SwiftPM Cache Identity
        id: swift_cache
        run: |
          fingerprint=$(bash scripts/ci/swift-cache-key.sh)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Reuse build state only within one lane and matching toolchain, SDK,
      # architecture, package graph and cache policy. Always build after restore:
      # SwiftPM must reconcile changed/deleted sources before --skip-build tests.
      - name: Cache SwiftPM Build State
        uses: actions/cache@v6
        with:
          path: |
            .build
            .build-swift6-no-whisper
          key: swiftpm-v1-behavior-${{ matrix.test_group }}-${{ steps.swift_cache.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            swiftpm-v1-behavior-${{ matrix.test_group }}-${{ steps.swift_cache.outputs.fingerprint }}-

      # Compile the normal dependency graph and tests once with the same
      # concurrency diagnostics used during execution. Keep build and run
      # separate so their costs are visible in the Actions step timings.
      - name: Swift Test Build (Concurrency Diagnostics)
        id: test_build
        timeout-minutes: 25
        run: |
          set -o pipefail
          swift build --build-tests -Xswiftc -warn-concurrency 2>&1 | tee ci-logs/swift-test-build.log

      - name: Concurrency Warning Baseline
        if: ${{ steps.test_build.outcome == 'success' }}
        run: python3 scripts/ci/check_concurrency_warnings.py --log ci-logs/swift-test-build.log

      - name: Ask Pi Helper
        timeout-minutes: 5
        env:
          SOTTO_ASK_TEST_HELPER: ${{ github.workspace }}/.build/ask-runtime/AskAgentHelper/ask-helper.cjs
        run: |
          set -euo pipefail
          scripts/build_ask_helper.sh .build/ask-runtime/AskAgentHelper .build/ask-runtime/node
          .build/ask-runtime/node --test Sources/AskAgentHelper/test/*.test.js

      - name: Swift Test
        id: tests
        timeout-minutes: 32
        env:
          SOTTO_ASK_TEST_NODE: ${{ github.workspace }}/.build/ask-runtime/node
        run: |
          set -o pipefail
          export SOTTO_CLI_TEST_EXECUTABLE="$PWD/.build/debug/sotto-cli"
          selection=(--skip "$AUDIO_TEST_FILTER")
          if [ "${{ matrix.test_group }}" = audio ]; then
            selection=(--filter "$AUDIO_TEST_FILTER")
          fi
          python3 scripts/ci/run-test-process.py --timeout 1800 -- \
            swift test --skip-build --parallel "${selection[@]}" -Xswiftc -warn-concurrency --xunit-output ci-logs/swift-tests.xml 2>&1 | tee ci-logs/swift-test.log

      - name: Test Summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && steps.tests.outcome != '' }}
        run: |
          set -o pipefail
          python3 scripts/ci/summarize-tests.py ci-logs/swift-tests.xml ci-logs/swift-test.log | tee ci-logs/test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ask CLI Qualification
        if: ${{ matrix.test_group == 'general' && success() }}
        timeout-minutes: 5
        env:
          CLI_BINARY: ${{ github.workspace }}/.build/debug/sotto-cli
          NODE_BINARY: ${{ github.workspace }}/.build/ask-runtime/node
          NODE_LICENSE_FILE: ${{ github.workspace }}/.build/ask-runtime/Legal/Node/LICENSE
          OUT_DIR: ${{ github.workspace }}/.build/ask-cli-archive
          VERSION: ci
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/dev/tests -p test_ask_workspace_qualification.py
          scripts/dist/build_cli_archive.sh
          mkdir -p .build/ask-cli-extracted
          tar -xzf "$OUT_DIR/sotto-cli-ci-darwin-$(uname -m).tar.gz" -C .build/ask-cli-extracted
          python3 scripts/dev/ask_workspace_qualification.py \
            --cli .build/ask-cli-extracted/sotto-cli \
            --output-dir ci-logs/ask-qualification

      - name: CLI Persistence Smoke
        if: ${{ matrix.test_group == 'general' && !cancelled() && steps.test_build.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -o pipefail
          python3 scripts/ci/cli-persistence-smoke.py "$PWD/.build/debug/sotto-cli" 2>&1 | tee ci-logs/cli-persistence-smoke.log

      - name: Meeting Process Recovery
        if: ${{ matrix.test_group == 'general' && !cancelled() && steps.test_build.outcome == 'success' }}
        timeout-minutes: 4
        env:
          SOTTO_CRASH_RECOVERY_TESTS: "1"
          SOTTO_TELEMETRY: "0"
        run: |
          set -o pipefail
          python3 scripts/ci/run-test-process.py --timeout 180 -- \
            swift test --skip-build -Xswiftc -warn-concurrency --filter 'MeetingRecordingCrashRecoveryTests/(testKillNineMidRecordingProducesPlayableFiles|testKilledRecordingRecoversInFreshProcessAndRemainsIdempotent)' 2>&1 | tee ci-logs/meeting-process-recovery.log

      - name: Swift 6 Language Mode
        if: ${{ matrix.test_group == 'general' && !cancelled() && steps.test_build.outcome == 'success' }}
        timeout-minutes: 15
        env:
          # Argmax/WhisperKit v0.18.0 is required for real builds but is not
          # Swift 6 language-mode clean yet. Keep this step focused on
          # first-party Sotto sources while release/test builds compile
          # the full WhisperKit dependency graph.
          SOTTO_SKIP_WHISPERKIT: "1"
        run: |
          mkdir -p ci-logs
          set -o pipefail
          swift build --build-path .build-swift6-no-whisper -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee ci-logs/swift-6-language-mode.log

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-evidence-${{ matrix.test_group }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  distribution:
    name: Release and Bundle
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Runner and Toolchain Evidence
        timeout-minutes: 2
        run: |
          mkdir -p ci-logs
          set -o pipefail
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            sysctl -n hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
          } 2>&1 | tee ci-logs/environment.log

      - name: Distribution Policy Fixtures
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          for fixture in test_macho_min_version test_prepare_meeting_echo_assets test_verify_meeting_echo_assets \
            test_verify_app_privacy_surface test_verify_release_version; do
            bash "scripts/dist/${fixture}.sh" 2>&1 | tee "ci-logs/${fixture}.log"
          done

      - name: SwiftPM Cache Identity
        id: swift_cache
        run: |
          fingerprint=$(bash scripts/ci/swift-cache-key.sh)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Reuse build state only within one lane and matching toolchain, SDK,
      # architecture, package graph and cache policy. Always build after restore:
      # SwiftPM must reconcile changed/deleted sources before --skip-build tests.
      - name: Cache SwiftPM Build State
        uses: actions/cache@v6
        with:
          path: |
            .build
          key: swiftpm-v1-distribution-${{ steps.swift_cache.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            swiftpm-v1-distribution-${{ steps.swift_cache.outputs.fingerprint }}-

      - name: Xcode Cache Identity
        id: xcode_cache
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-xcode-dist
        run: |
          fingerprint=$(bash scripts/ci/xcode-cache-key.sh)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode Build State
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sotto-xcode-dist
          key: xcode-v1-${{ steps.xcode_cache.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            xcode-v1-${{ steps.xcode_cache.outputs.fingerprint }}-

      - name: Swift Build (Release)
        timeout-minutes: 25
        run: |
          mkdir -p ci-logs
          set -o pipefail
          swift build -c release 2>&1 | tee ci-logs/swift-build-release.log

      - name: Ask Release Gate
        timeout-minutes: 2
        run: |
          python3 scripts/dev/ask_workspace_qualification.py \
            --cli .build/release/sotto-cli \
            --output-dir ci-logs/ask-disabled --expect-disabled

      - name: Release Bundle Smoke
        timeout-minutes: 25
        env:
          BUILD_SYSTEM: xcodebuild
          XCODE_BUILD_LOG: ci-logs/xcode-release-build.log
          BUNDLE_YTDLP: "0"
          BUNDLE_NODE: "0"
          FFMPEG_PATH: /usr/bin/true
          VERSION: 0.0.0
          BUILD_NUMBER: ci
          # Keep Xcode DerivedData and native echo-suppression build/source
          # outputs out of SwiftPM's tree. DerivedData has a separate cache;
          # native echo assets are rebuilt by the packaging script.
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-xcode-dist
          SOTTO_MEETING_ECHO_ASSETS_DIR: ${{ runner.temp }}/sotto-meeting-echo-assets
          LOCALVQE_SOURCE_DIR: ${{ runner.temp }}/sotto-localvqe-src
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./scripts/dist/build_app_bundle.sh 2>&1 | tee ci-logs/release-bundle-smoke.log
          swift - dist/Sotto.app/Contents/Resources/SwiftStreamingMarkdown_SwiftStreamingMarkdown.bundle <<'SWIFT'
          import AppKit
          guard let bundle = Bundle(path: CommandLine.arguments[1]),
                bundle.bundleIdentifier != nil,
                bundle.url(forResource: "Assets", withExtension: "car") != nil,
                NSColor(named: "Colors/Copilot/Theme/Foreground/Primary/450", bundle: bundle) != nil,
                bundle.image(forResource: "Copy") != nil,
                bundle.image(forResource: "downloadArrow") != nil else {
              fatalError("Packaged Markdown colors and action icons must resolve without build-directory resources")
          }
          print("Packaged Markdown assets resolve")
          SWIFT

      - name: CLI Contract Smoke
        timeout-minutes: 2
        env:
          SOTTO_TELEMETRY: "0"
        run: |
          mkdir -p ci-logs
          set -o pipefail
          dist/Sotto.app/Contents/MacOS/sotto-cli --help > ci-logs/cli-help.txt
          dist/Sotto.app/Contents/MacOS/sotto-cli spec --json > ci-logs/cli-spec.json
          python3 -m json.tool ci-logs/cli-spec.json > /dev/null
          python3 - <<'PY'
          import json

          with open("ci-logs/cli-spec.json", encoding="utf-8") as f:
              spec = json.load(f)

          commands = {
              tuple(command["path"]): command
              for command in spec["commands"]
          }
          export = commands[("meetings", "export")]
          if export["jsonMode"] != "--stdout --format json":
              raise SystemExit(
                  f"Unexpected meetings export jsonMode: {export['jsonMode']!r}"
              )
          PY

      - name: Upload Distribution Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-distribution-evidence
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  # Opt-in qualification restores the exact entries saved by distribution.
  # It changes only this disposable checkout and never saves mutated build state.
  cache-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_build_cache }}
    needs: distribution
    name: Build Cache Invalidation
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Cache Identities
        id: cache
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-xcode-dist
        run: |
          swift=$(bash scripts/ci/swift-cache-key.sh)
          xcode=$(bash scripts/ci/xcode-cache-key.sh)
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: .build
          key: swiftpm-v1-distribution-${{ steps.cache.outputs.swift }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sotto-xcode-dist
          key: xcode-v1-${{ steps.cache.outputs.xcode }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Verify Changed App and Resource Reach Package
        timeout-minutes: 35
        env:
          BUILD_SYSTEM: xcodebuild
          SKIP_BUILD: "0"
          BUNDLE_YTDLP: "0"
          BUNDLE_NODE: "0"
          FFMPEG_PATH: /usr/bin/true
          VERSION: 0.0.0
          BUILD_NUMBER: ci-cache-qualification
          XCODE_BUILD_LOG: ci-logs/xcode-cache-invalidation.log
          XCODE_DERIVED_DATA: ${{ runner.temp }}/sotto-xcode-dist
          SOTTO_MEETING_ECHO_ASSETS_DIR: ${{ runner.temp }}/sotto-meeting-echo-assets
          LOCALVQE_SOURCE_DIR: ${{ runner.temp }}/sotto-localvqe-src
        run: |
          mkdir -p ci-logs
          set -o pipefail
          python3 scripts/ci/qualify-xcode-cache.py --qualify 2>&1 | tee ci-logs/cache-invalidation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cache-invalidation-evidence
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  # Preserve the existing check name as the complete CI verdict. An individual
  # lane passing must never conceal a failed, skipped, or cancelled dependency.
  swift-test:
    if: always()
    needs: [behavior, distribution, cache-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require Every CI Lane
        env:
          BEHAVIOR_RESULT: ${{ needs.behavior.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          QUALIFICATION_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_build_cache }}
          QUALIFICATION_RESULT: ${{ needs['cache-qualification'].result }}
        run: |
          printf 'Tests and Swift 6: %s\nRelease and Bundle: %s\n' "$BEHAVIOR_RESULT" "$DISTRIBUTION_RESULT"
          test "$BEHAVIOR_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
          if [ "$QUALIFICATION_REQUESTED" = true ]; then
            test "$QUALIFICATION_RESULT" = success
          else
            test "$QUALIFICATION_RESULT" = skipped
          fi
